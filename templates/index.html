<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toxic Comment Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f4f4f4;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 1rem;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      margin-top: 1rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .result {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Toxic Comment Classifier</h2>
    <p>Enter a comment to check whether it's toxic or non-toxic:</p>
    <textarea id="comment" rows="5" placeholder="Type your comment here..."></textarea>
    <br />
    <button onclick="classify()">Check Toxicity</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function classify() {
      const comment = document.getElementById("comment").value;
      const resultDiv = document.getElementById("result");
      resultDiv.innerText = "Processing...";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text: comment })
        });

        const data = await response.json();
        const label = data.prediction === 1 ? "⚠️ Toxic" : "✅ Non-Toxic";
        resultDiv.innerText = `Prediction: ${label}`;
      } catch (error) {
        resultDiv.innerText = "❌ Error: Could not get prediction.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
